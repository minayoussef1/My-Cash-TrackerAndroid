name: "Build My Cash: Tracker APK"

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check lock file exists
        working-directory: masrofaty-android
        run: |
          test -f package.json || { echo "ERROR: package.json missing"; exit 1; }
          test -f package-lock.json || { echo "ERROR: package-lock.json missing"; exit 1; }
          echo "lock file OK"

      - name: Install pinned dependencies
        working-directory: masrofaty-android
        run: npm ci --legacy-peer-deps

      - name: Print installed versions
        working-directory: masrofaty-android
        run: |
          echo "===== INSTALLED VERSIONS ====="
          npm ls --depth=0 || true
          echo "===== END VERSIONS ====="

      - name: Check project files
        working-directory: masrofaty-android
        run: |
          ls -la
          test -f capacitor.config.json && cat capacitor.config.json
          test -d www && ls www

      - name: Add Android project (first time only)
        working-directory: masrofaty-android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Copy web files into the Android project
        working-directory: masrofaty-android
        run: npx cap sync android

      - name: Add microphone permission to the Android app
        working-directory: masrofaty-android/android/app/src/main
        run: |
          grep -q 'android.permission.RECORD_AUDIO' AndroidManifest.xml || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />#' AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' AndroidManifest.xml || { echo "ERROR: microphone permission not added"; exit 1; }
          grep -n "RECORD_AUDIO" AndroidManifest.xml

      - name: Allow speech recognition service (Android 11+)
        working-directory: masrofaty-android/android/app/src/main
        run: |
          grep -q 'android.speech.RecognitionService' AndroidManifest.xml || sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>#' AndroidManifest.xml
          grep -q 'android.speech.RecognitionService' AndroidManifest.xml || { echo "ERROR: speech service query not added"; exit 1; }
          grep -n "RecognitionService" AndroidManifest.xml

      - name: Check speech recognition plugin is installed
        working-directory: masrofaty-android
        run: |
          test -d node_modules/@capacitor-community/speech-recognition || { echo "ERROR: speech plugin missing"; exit 1; }
          echo "speech plugin OK"

      - name: Check voice recorder plugin is installed
        working-directory: masrofaty-android
        run: |
          test -d node_modules/capacitor-voice-recorder || { echo "ERROR: voice plugin missing"; exit 1; }
          echo "voice plugin OK"

      - name: Force English app name on the phone
        working-directory: masrofaty-android/android
        run: |
          F=app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">My Cash: Tracker</string>#' "$F"
          sed -i 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">My Cash: Tracker</string>#' "$F"
          grep -n "app_name" "$F"

      - name: Use fixed signing key (keeps Google sign-in working)
        working-directory: masrofaty-android
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore

      - name: Set the app version from the build number
        working-directory: masrofaty-android/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" build.gradle
          grep -nE "versionCode|versionName" build.gradle

      - name: Build debug APK
        working-directory: masrofaty-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: masrofaty-android/android/app/build/outputs/apk/debug
        run: cp app-debug.apk my-cash-tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-cash-tracker-apk
          path: masrofaty-android/android/app/build/outputs/apk/debug/my-cash-tracker.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "My Cash: Tracker build ${{ github.run_number }}"
          body: APK built automatically from the latest commit.
          files: masrofaty-android/android/app/build/outputs/apk/debug/my-cash-tracker.apk

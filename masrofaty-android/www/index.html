/* ===== Layout pass v2: iOS-style grouped surfaces, segmented controls, icon tiles ===== */
:root{--seg:rgba(118,118,128,.12);--tint-g:rgba(34,197,94,.14);--tint-r:rgba(239,68,68,.12);--tint-p:rgba(139,92,246,.14);--tint-b:rgba(var(--accrgb),.14)}
:root[data-theme="dark"]{--seg:rgba(120,130,160,.18);--tint-g:rgba(34,197,94,.2);--tint-r:rgba(239,68,68,.2);--tint-p:rgba(139,92,246,.22);--tint-b:rgba(var(--accrgb),.22)}
body{background-color:var(--page)}
h2{font-size:28px;font-weight:800;letter-spacing:-.3px;margin:8px 4px 16px}
.hi{margin:4px 2px 14px}
.hi b{font-size:22px;font-weight:800}
.hi small{font-size:13px}
.av{width:42px;height:42px;border-radius:50%;border:0;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:17px;font-weight:700;font-family:inherit}
/* balance: solid accent card, big number */
.bal{padding:18px 18px 16px;border-radius:24px}
.bal .n{font-size:40px;font-weight:800;letter-spacing:-.5px}
.bal .pbar{background:rgba(255,255,255,.28);height:6px}
.bal .pbar i{background:#fff!important}
/* stat tiles with icon squares */
.grid3 .g,.grid2 .g{border-radius:20px;text-align:start}
.st[data-ic]{position:relative;padding:14px 12px 12px!important;min-height:92px}
.st[data-ic]::before{content:attr(data-glyph);position:absolute;top:12px;inset-inline-end:12px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--tint,var(--tint-b))}
.st[data-ic="inc"]{--tint:var(--tint-g)}.st[data-ic="exp"]{--tint:var(--tint-r)}
.st[data-ic="loan"]{--tint:var(--tint-p)}.st[data-ic="days"],.st[data-ic="avail"]{--tint:var(--tint-b)}
.st[data-ic] small{margin-top:0;padding-inline-end:36px;font-size:12px}
.st[data-ic] b{display:block;margin-top:14px;font-size:18px;font-weight:700}
/* grouped inset lists (settings, plans) */
.g>.sec{font-size:13px;font-weight:600;margin:6px 6px 4px}
.g>.btn.s{background:none!important;border:0!important;border-radius:0;border-top:1px solid var(--line);margin:0!important;padding:15px 6px;text-align:start;font-size:16px;font-weight:500;color:var(--text);display:flex;align-items:center;justify-content:space-between;box-shadow:none}
.g>.btn.s::after{content:"‹";color:var(--mut);font-size:24px;line-height:1;margin-inline-start:8px}
.g>.sec+.btn.s,.g>.sec:first-child+.btn.s{border-top:0}
/* segmented controls */
.tabs{background:var(--seg);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:nowrap}
.tabs .chip{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--mut);box-shadow:none}
.tabs .chip.on{background:var(--glass);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);border:0}
:root[data-theme="dark"] .tabs .chip.on{background:#2a3450}
.tabs .sw{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid transparent;margin:2px}
.tabs .sw.on{border-color:var(--text)}
/* inputs closer to iOS fields */
input,textarea{border-radius:12px;padding:12px 14px;background:var(--inp)}
.btn{border-radius:14px;font-weight:600}
/* group cards */
.g{border-radius:20px;padding:6px 14px}
.g .row{padding:12px 0}
.g .row .ic{border-radius:11px;width:38px;height:38px}
/* bottom nav: floating pill with labels */
.nav>div{border-radius:30px;padding:8px 10px}
.nav button{font-size:11px;font-weight:600}
.nav .fab{width:58px;height:58px;margin-top:-34px;box-shadow:0 10px 26px rgba(var(--accrgb),.45)}
.tabs.wide{overflow-x:auto;scrollbar-width:none}.tabs.wide::-webkit-scrollbar{display:none}.tabs.wide .chip{flex:none;white-space:nowrap;padding:8px 12px}

/* ===== v3: summary donut, settings rows with icon tiles ===== */
.dflex{display:flex;align-items:center;gap:18px;margin-top:8px}
.dflex .donut{flex:none;width:150px;height:150px;margin:0}
.dflex .donut div{width:104px;height:104px}
.dleg{flex:1;min-width:0}
.dleg .lg{padding:9px 0;border-bottom:1px solid var(--line)}
.dleg .lg:last-child{border:0}
.pf{display:flex;align-items:center;gap:14px;padding:16px}
.pf b{display:block;font-size:18px;font-weight:700}
.pf small{color:var(--mut);font-size:13px}
.av.big{width:56px;height:56px;font-size:22px;flex:none}
.g>.btn.s{display:flex;align-items:center;gap:12px;justify-content:flex-start}
.g>.btn.s>span{flex:1;text-align:start}
.g>.btn.s::after{margin-inline-start:auto}
.ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:16px;background:var(--tint-b);flex:none}
.pf .av{margin:0;display:grid;place-items:center;line-height:1;padding:0}

/* ===== v4: centered screen titles, daily expense chart, wallets screen ===== */
h2{text-align:center;font-size:18px;font-weight:700;margin:4px 0 14px}
.dbar{display:flex;gap:8px;height:170px;margin-top:6px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mut);width:44px;text-align:end;padding-bottom:18px;direction:ltr}
.dcols{flex:1;display:flex;align-items:stretch;gap:3px;border-inline-start:1px dashed var(--line)}
.dc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.dc i{display:block;width:62%;border-radius:4px 4px 2px 2px;background:var(--acc);min-height:2px;transition:height .4s ease}
.dc small{font-size:10px;color:var(--mut);height:12px;line-height:12px}
.wtot{text-align:center;padding:18px}
.wtot small{display:block;color:var(--mut);font-size:13px}
.wtot b{font-size:30px;font-weight:800}
.wcard{display:flex;align-items:center;gap:12px;padding:14px}
.wi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--tint-b);flex:none}
.wm{flex:1;min-width:0}
.wm small{display:block;color:var(--mut);font-size:13px}
.wm b{font-size:18px;font-weight:700}
/* ===== v5: settings screen matches the reference ===== */
.pfb{width:100%;display:flex;align-items:center;gap:14px;border:0;color:var(--text);font:inherit;text-align:start;padding:16px;margin-bottom:16px;cursor:pointer}
.pfb .pt{display:block}
.pfb .pt b{display:block;font-size:18px;font-weight:700}
.pfb .pt small{display:block;color:var(--mut);font-size:13px}
.pfb .av{width:56px;height:56px;margin:0;display:grid;place-items:center;flex:none;background:var(--tint-b);color:var(--acc)}
.pfb .av .ico{width:28px;height:28px}
.sgrp{background:var(--glass);border:1px solid var(--line);border-radius:20px;margin:0 0 16px;overflow:hidden;box-shadow:var(--shadow-card)}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;text-align:start;min-height:52px;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .ico{width:22px;height:22px;color:var(--acc);flex:none}
.srow .sl{flex:1}
.srow em{font-style:normal;color:var(--mut);font-size:15px}
.sch{color:var(--mut);font-size:22px;line-height:1;font-style:normal}
.panel.det{max-height:88vh;overflow-y:auto;text-align:start}
.panel.det h3{text-align:center}
.det .g,.det .sgrp{margin:0 0 12px}
.det .sgrp .srow .ico{width:20px;height:20px}
.det .wrapT{flex-wrap:wrap}
/* ===== v6: reports layout as reference, pure black dark theme ===== */
.rtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rtop h2{flex:1;margin:0}
.rback{width:36px;height:36px;border-radius:50%;border:0;background:var(--glass);color:var(--text);font-size:24px;line-height:1;box-shadow:var(--shadow-card);display:grid;place-items:center;padding:0}
.rsp{width:36px}
.seg3 .chip{font-size:13px;white-space:nowrap}
.dflex .donut{width:150px;height:150px}
:root[data-theme="dark"]{--page:#000000;--glass:#111113;--line:#222226;--inp:#0a0a0c;--panel:#111113;--nav:rgba(12,12,14,.85);--hole:#111113;--mut:#8e8e93;--text:#f2f2f7;--seg:rgba(120,120,128,.28)}
:root[data-theme="dark"] .tabs .chip.on{background:#2c2c2e}
:root[data-theme="dark"] .bal{background:linear-gradient(135deg,var(--acc),var(--acc2))!important}
:root[data-theme="dark"] .sgrp,:root[data-theme="dark"] .g{border-color:#222226}
/* ===== v9: dark-mode card separation ===== */
:root[data-theme="dark"]{--glass:#141418;--line:#2c2c33}
:root[data-theme="dark"] .g,:root[data-theme="dark"] .sgrp{border:1px solid #2c2c33!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)!important}
:root[data-theme="dark"] .srow,:root[data-theme="dark"] .row{border-color:#24242b}
/* ===== v10: dark theme elevation - lifted surfaces, visible icons and controls on black ===== */
:root[data-theme="dark"]{--page:#000000;--glass:#1c1c1f;--line:#2c2c31;--inp:#26262b;--panel:#1c1c1f;--nav:rgba(28,28,31,.88);--hole:#1c1c1f;--mut:#9a9aa3;--text:#f5f5f7;--seg:#1c1c1f;--tint-g:rgba(52,211,153,.22);--tint-r:rgba(248,113,113,.22);--tint-p:rgba(167,139,250,.24);--tint-b:rgba(var(--accrgb),.26)}
:root[data-theme="dark"] .g,:root[data-theme="dark"] .sgrp{background:#1c1c1f!important;border:1px solid #2c2c31!important;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 18px rgba(0,0,0,.55)!important}
:root[data-theme="dark"] .st[data-ic]::before{box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
:root[data-theme="dark"] .btn.s,:root[data-theme="dark"] .g>.btn.s{background:#26262b!important;border-color:#2c2c31!important;color:#f5f5f7}
:root[data-theme="dark"] .chip{background:#26262b;border-color:#34343b;color:#e5e5ea}
:root[data-theme="dark"] .tabs{background:#1c1c1f;border:1px solid #2c2c31}
:root[data-theme="dark"] .tabs .chip{background:transparent;border-color:transparent;color:#9a9aa3}
:root[data-theme="dark"] .tabs .chip.on{background:#3a3a40!important;color:#fff!important;box-shadow:0 1px 3px rgba(0,0,0,.5)!important}
:root[data-theme="dark"] .cat,:root[data-theme="dark"] .cty{background:#26262b;border-color:#34343b}
:root[data-theme="dark"] .ic,:root[data-theme="dark"] .wi,:root[data-theme="dark"] .ti{box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
:root[data-theme="dark"] .srow .ico,:root[data-theme="dark"] .sch{color:#7aa2ff}
:root[data-theme="dark"] .nav>div{background:#1c1c1f!important;border:1px solid #2c2c31;box-shadow:0 10px 30px rgba(0,0,0,.6)!important}
:root[data-theme="dark"] .nav button{color:#8e8e96}
:root[data-theme="dark"] .nav button.on{color:#fff}
:root[data-theme="dark"] .bal{box-shadow:0 10px 28px rgba(0,0,0,.5)!important}
:root[data-theme="dark"] input,:root[data-theme="dark"] textarea{background:#26262b;border-color:#34343b;color:#f5f5f7}
:root[data-theme="dark"] .row{border-color:#2c2c31}
:root[data-theme="dark"] .rback{background:#26262b;color:#f5f5f7;box-shadow:0 1px 0 rgba(255,255,255,.06) inset}

/* ===== v11: add-transaction screen as reference ===== */
.seg2{display:flex;gap:10px;margin:4px 0 12px}
.st2{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:17px;font-weight:600;color:var(--mut);font-family:inherit;box-shadow:var(--shadow-card)}
.st2.exp.on{background:#fde7e7;color:#e11d48;border-color:#f8b4b4}
.st2.inc.on{background:#dcfce7;color:#16a34a;border-color:#a7f3d0}
:root[data-theme="dark"] .st2.exp.on{background:rgba(248,113,113,.16);color:#fb7185;border-color:rgba(248,113,113,.35)}
:root[data-theme="dark"] .st2.inc.on{background:rgba(52,211,153,.16);color:#34d399;border-color:rgba(52,211,153,.35)}
.flab{display:block;text-align:center;color:var(--mut);font-size:14px;margin:14px 0 6px}
.fcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-card);font:inherit;color:var(--text);text-align:start;margin:0}
.fcard input{border:0;background:transparent;padding:0;box-shadow:none;font-size:16px;color:var(--text);flex:1;min-width:0}
.fcard input:focus{border:0}
.fcard .fv{flex:1;color:var(--mut);font-size:16px}
.fcard.frow .sch{color:var(--mut)}
.amt{justify-content:space-between}
.amtin{font-size:34px!important;font-weight:800;text-align:end;color:var(--text)!important}
.amt .cur{font-size:18px;font-weight:600;color:var(--mut)}
.ficon2{width:36px;height:36px;border-radius:12px;background:var(--tint-b);display:grid;place-items:center;font-size:17px;flex:none}
.savebtn{margin-top:18px;border-radius:16px;font-size:17px;padding:16px;background:var(--acc)}
.orow{margin-top:0}
.frow:not(.orow) .fv{text-align:start}
/* ===== Font: Ping AR + LT (Arabic + Latin), file in ./fonts/. Falls back to system font if missing ===== */
@font-face{font-family:'PingAR';src:url('fonts/PingAR-Medium.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
body,button,input,select,textarea{font-family:'PingAR',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif!important}
/* ===== v12: bottom dock hides when scrolling down, returns when scrolling up ===== */
.nav{transition:transform .85s cubic-bezier(.25,.8,.25,1)}
.nav.nav-hide{transform:translateY(160%)}
@media (prefers-reduced-motion:reduce){.nav{transition:none}}
html.lite .nav{transition:transform .85s cubic-bezier(.25,.8,.25,1)!important}
/* ===== About sheet ===== */
.appmark{width:68px;height:68px;margin:0 auto;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.appmark .ico{width:34px;height:34px;color:#fff}
.av.mini{width:40px;height:40px;margin:0;display:grid;place-items:center;background:var(--tint-b);color:var(--acc);flex:none;border-radius:50%}
.av.mini .ico{width:20px;height:20px;color:var(--acc)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:14px 0 6px}
.tabs.wide .chip{padding:9px 14px;font-size:14px;line-height:1.2}
.tabs.wide{padding:4px}
/* ===== v18: cleaner + button ===== */
.nav .fab{background:var(--acc)!important;box-shadow:0 6px 16px rgba(var(--accrgb),.32)!important;border:4px solid var(--nav-solid,#fff)}
:root[data-theme="dark"] .nav .fab{--nav-solid:#1c1c1f}
:root[data-theme="light"] .nav .fab{--nav-solid:#ffffff}
.ins{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.ins:last-child{border:0}.ins small{color:var(--mut);font-size:12px}.ins b{font-weight:700}

/* ===== Home redesign (visual only) ===== */
.hero-hi{display:flex;align-items:center;gap:12px;margin:6px 2px 4px}
.hero-hi .hg{flex:1;text-align:start}
.hero-hi .hg b{display:block;font-size:20px;font-weight:800}
.hero-hi .hg small{color:var(--mut);font-size:13px}
.bell{width:42px;height:42px;border-radius:50%;border:0;background:var(--glass);box-shadow:var(--shadow-card);font-size:18px;flex:none}
.hdate{margin:0 4px 12px}.hdate small{color:var(--mut);font-size:13px}
.bal{background:linear-gradient(135deg,var(--acc),var(--acc2))!important;border-radius:26px!important;padding:20px 20px 18px!important;position:relative;overflow:hidden}
.bal::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:90px;background:radial-gradient(60% 100% at 50% 100%,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 16px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text);font:inherit;font-size:13px;font-weight:600;padding:0}
.qa i{font-style:normal;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--glass);box-shadow:var(--shadow-card);color:var(--acc)}
.qa button:first-child i{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.grid3 .st[data-ic="inc"],.grid3 .st[data-ic="exp"],.grid3 .st[data-ic="loan"]{border-radius:22px}
.grid3 .st[data-ic="inc"]{background:linear-gradient(160deg,rgba(var(--accrgb),.14),rgba(var(--accrgb),.04))}
.grid3 .st[data-ic="exp"]{background:linear-gradient(160deg,rgba(var(--accrgb),.14),rgba(var(--accrgb),.04))}
.grid3 .st[data-ic="loan"]{background:linear-gradient(160deg,rgba(var(--accrgb),.14),rgba(var(--accrgb),.04))}
:root[data-theme="dark"] .grid3 .st[data-ic]{background:var(--glass)!important}
.qa2{grid-template-columns:repeat(2,minmax(0,140px));justify-content:center;column-gap:36px}

/* ===== v3 home: single savings blob, bell badge ===== */
.qa1{grid-template-columns:1fr;justify-items:center;margin:14px 0 18px}
.qa1 button{width:auto}
.qa1 i.blob{width:96px;height:96px;border-radius:52% 48% 60% 40% / 45% 55% 45% 55%;background:linear-gradient(135deg,#ffd6e8,#d9c8ff 55%,#bfe3ff);box-shadow:0 10px 26px rgba(120,90,255,.22);font-size:34px;color:inherit;position:relative}
.qa1 i.blob::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px dashed rgba(120,90,255,.25);animation:none}
.bell{position:relative}
.bdg{position:absolute;top:-3px;inset-inline-end:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;line-height:18px;display:none}

/* ===== v4 home: full-width savings row ===== */
.sv-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;border:0;border-radius:20px;background:var(--glass);box-shadow:var(--shadow-card);font:inherit;font-size:17px;font-weight:700;color:var(--text);margin:0 0 12px;cursor:pointer;text-align:start}
.sv-row .sch{color:var(--mut);font-size:24px;line-height:1;font-style:normal}
.sv-row:active{transform:scale(.99)}


.thumb{width:42px;height:42px;border-radius:12px;object-fit:cover;display:block;background:var(--line)}

/* ===== v7 motion: entrance, draw-in lines, press feedback ===== */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drawln{from{stroke-dasharray:600;stroke-dashoffset:600}to{stroke-dasharray:600;stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.panel.det .g,.panel.det .sgrp,.panel.det .ins,.panel.det .srow{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.panel.det .ins:nth-child(2),.panel.det .srow:nth-child(2){animation-delay:.05s}
.panel.det .ins:nth-child(3),.panel.det .srow:nth-child(3){animation-delay:.1s}
.panel.det .ins:nth-child(4),.panel.det .srow:nth-child(4){animation-delay:.15s}
.panel.det .ins:nth-child(5),.panel.det .srow:nth-child(5){animation-delay:.2s}
.grid3 .st,.grid2 .st,.sv-row,.bal,.wcard,.tap{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.grid3 .st:nth-child(2),.grid2 .st:nth-child(2){animation-delay:.06s}
.grid3 .st:nth-child(3){animation-delay:.12s}
.sv-row{animation-delay:.1s}
.draw{animation:drawln 1.2s ease-out both}
.chip.on{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.srow:active,.tap:active,.st:active{transform:scale(.98);transition:transform .12s}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rcell{border-radius:14px;overflow:hidden;background:var(--glass);box-shadow:var(--shadow-card);cursor:pointer;animation:rise .4s both}
.rcell img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--line)}
.rcell small{display:block;padding:6px;font-size:10px;color:var(--mut);line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== wallets: stacked cards + wave ===== */
.walwrap{position:relative;padding:8px 0 4px;overflow:hidden;border-radius:26px}
.wave{position:absolute;inset:0;pointer-events:none;z-index:0}
.wave svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wv 8s linear infinite}
.wave svg:nth-child(2){animation-duration:12s;animation-direction:reverse}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.wtotal{position:relative;z-index:2;text-align:center;padding:4px 0 0}
.wtotal small{display:block;color:var(--mut);font-size:13px}
.wtotal b{font-size:30px;font-weight:800}
.wstack{position:relative;height:196px;margin-top:50px;z-index:2}
.wcard3{position:absolute;left:50%;top:0;width:84%;height:148px;border-radius:24px;color:#fff;padding:16px 18px;box-shadow:0 14px 34px rgba(0,0,0,.18);transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .6s ease,filter .6s ease;cursor:pointer;overflow:hidden}
.wcard3::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.wc3-top{display:flex;align-items:center;gap:8px}
.wc3-ico{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px}
.wc3-top small{font-size:14px;font-weight:600;opacity:.95}
.wc3-bal{font-size:28px;font-weight:800;margin-top:16px;letter-spacing:-.3px}
.wc3-foot{font-size:12px;opacity:.8;margin-top:4px}
.f0{transform:translate(-50%,0) scale(1);z-index:3;opacity:1}
.f1{transform:translate(calc(-50% + 14px),-22px) scale(.94);z-index:2;opacity:.9;filter:saturate(.95)}
.f2{transform:translate(calc(-50% + 28px),-44px) scale(.88);z-index:1;opacity:.65;filter:saturate(.9)}
.fh{transform:translate(-50%,60px) scale(.8);z-index:0;opacity:0;pointer-events:none}

/* ===== stacked deck: home overview ===== */
.qstack{position:relative;height:140px;margin:50px 0 4px}
.qstack .sk{position:absolute;left:50%;top:0;width:150px;height:132px;border-radius:24px;color:#fff;padding:14px 14px;box-shadow:0 14px 30px rgba(0,0,0,.16);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s ease;cursor:pointer;overflow:hidden;user-select:none;touch-action:pan-y}
.qstack .sk::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.qc-inc{background:linear-gradient(135deg,#10b981,#06b6d4)}
.qc-exp{background:linear-gradient(135deg,#f43f5e,#fb923c)}
.qc-loan{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.qc-top{display:flex;align-items:center;gap:8px}
.qc-top span{width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:16px}
.qc-top small{font-size:12px;font-weight:600;opacity:.95;line-height:1.2}
.qc-val{font-size:20px;font-weight:800;margin-top:12px;white-space:nowrap}
.qc-foot{font-size:12px;opacity:.8;margin-top:4px}
.qstack .f0{transform:translate(-50%,0) scale(1);z-index:3;opacity:1}
.qstack .f1{transform:translate(calc(-50% + 12px),-18px) scale(.94);z-index:2;opacity:.9}
.qstack .f2{transform:translate(calc(-50% + 24px),-36px) scale(.88);z-index:1;opacity:.65}
.qstack .fh{transform:translate(-50%,50px) scale(.8);z-index:0;opacity:0;pointer-events:none}
.qhint{font-size:12px;color:var(--mut);text-align:center;margin:0 0 12px}
.qhead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.qplus{width:34px;height:34px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 6px 16px rgba(var(--accrgb),.35)}
.qwrap{display:flex;gap:12px;margin:0 0 14px}
.qbox{position:relative;flex:1;min-width:0;aspect-ratio:1/1}
.hs{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:24px;overscroll-behavior-x:contain}
.vs{height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;border-radius:24px;overscroll-behavior-y:contain}
.hs::-webkit-scrollbar,.vs::-webkit-scrollbar{display:none}
.wc,.vs .qc{box-sizing:border-box;height:100%;border-radius:24px;color:#fff;padding:14px;position:relative;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.wc{flex:0 0 100%}.vs .qc{padding-left:26px}
.wc::after,.vs .qc::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.hdots{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.vdots{position:absolute;left:9px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hdots i,.vdots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.45;transition:opacity .2s,transform .2s}
.hdots i.on,.vdots i.on{opacity:1;transform:scale(1.25)}
.wc-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px}.plusbig{font-size:56px;line-height:1;font-weight:300}.wc-add small{font-size:12px;opacity:.9}
.wsq{height:100%;box-sizing:border-box;margin:0!important;padding:14px!important;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border-radius:24px}
.wsq .wsi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.wsq small{display:block;color:var(--mut);font-size:12.5px;margin-bottom:4px}.wsq b{display:block;font-size:19px;font-weight:800;white-space:nowrap}.wsq em{display:block;font-style:normal;color:var(--mut);font-size:12px;margin-top:4px}
.mi{display:inline-block;width:22px;height:22px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;vertical-align:middle}
.nav .ico .mi{width:26px;height:26px;display:block}
.bell{color:var(--text)}
.wc-add .plusic{width:64px;height:64px;color:#fff}.vmic{width:16px;height:16px;margin-inline-start:6px;color:var(--acc);cursor:pointer}
/* ===== v12 account cards ===== */
.wcard3.static{position:relative;left:0;top:0;width:100%;transform:none;opacity:1;filter:none;margin:14px 0 8px;cursor:default}
.wc3-logo{width:38px;height:38px;border-radius:11px;object-fit:cover;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.wc3-bot{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;align-items:center;direction:ltr}
.wc3-num{font-size:15px;letter-spacing:2px;font-weight:600;opacity:.95}
.kcard{direction:ltr}.kcard .wc3-top{justify-content:space-between}.kcard .wc3-bal{text-align:left}
.nfc{opacity:.85}
.bm-visa{font:italic 900 25px/1 Arial,Helvetica,sans-serif;letter-spacing:-1px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.bm-mz{font:800 18px/1 Arial,sans-serif;letter-spacing:.5px}
.bm-mc{display:inline-flex}.bm-mc i{width:26px;height:26px;border-radius:50%;background:#eb001b}.bm-mc i+i{background:#f79e1b;margin-inline-start:-11px;opacity:.9}
.kcash .bills{position:absolute;inset-inline-end:-34px;bottom:-28px;width:175px;opacity:.95;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.wlogo{width:100%;height:100%;object-fit:cover;border-radius:14px}
.wi:has(.wlogo){padding:0;overflow:hidden}
.nhint{margin:0 4px 12px;color:var(--mut);font-size:14px}
.ntiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nt{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 8px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:inherit;font-size:16px}
.nt.on{background:rgba(var(--accrgb),.14);border-color:var(--acc)}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:10px}.plist.c3{grid-template-columns:repeat(3,1fr)}
.pv2{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:inherit;text-align:start}
.pv2 img,.pv2 .pvi{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none;display:grid;place-items:center;font-size:20px;background:var(--tint-b)}
.pv2 b{font-size:14px}.pv2.on{background:rgba(var(--accrgb),.14);border-color:var(--acc)}
.plist.c3 .pv2{justify-content:center}
.bkm{font:800 10px/1 Arial,sans-serif;letter-spacing:0;direction:ltr}.tl{display:flex;align-items:center;gap:8px;min-width:0}
.cmid{display:flex;justify-content:space-between;align-items:center;margin-top:10px;direction:ltr}
.cmid .wc3-bal{margin:0;font-size:24px}
.chip3{width:40px;height:29px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);background:linear-gradient(90deg,transparent 47%,rgba(0,0,0,.22) 48% 52%,transparent 53%),linear-gradient(0deg,transparent 47%,rgba(0,0,0,.22) 48% 52%,transparent 53%),linear-gradient(135deg,#f6dc8a,#c9a032)}
.kcard::before{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.wstack,.qstack{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wcard3,.qstack .sk{touch-action:pan-y;will-change:transform;backface-visibility:hidden;-webkit-user-drag:none;transition:transform .4s cubic-bezier(.22,.9,.3,1),opacity .3s ease}
.f1,.f2,.qstack .f1,.qstack .f2{filter:none}
.wcard3.f0{cursor:grab}.wcard3.f0:active{cursor:grabbing}

.kcash.plain .note{display:none}
.wcar{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:20px 14% 24px;position:relative;z-index:2;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.wcar::-webkit-scrollbar{display:none}
.wcar .wcard3{position:relative;left:auto;top:auto;width:auto;flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;transition:none;margin:0;touch-action:pan-x pan-y}
.wdots{display:flex;justify-content:center;gap:7px;padding:0 0 14px;position:relative;z-index:2}
.wdots i{width:7px;height:7px;border-radius:99px;background:var(--mut);opacity:.35;transition:width .25s,opacity .25s,background .25s;cursor:pointer}
.wdots i.on{width:22px;opacity:1;background:var(--acc)}
.wfil{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.wfil::-webkit-scrollbar{display:none}
.wfil button{flex:none;padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:inherit;font-size:14px;font-weight:600}
.wfil button.on{background:var(--acc);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(var(--accrgb),.35)}
.wrow{display:flex;align-items:center;gap:14px;padding:13px 14px!important;margin-bottom:12px!important;cursor:pointer;text-align:start}
.wt{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.14);color:#fff}
.wt img{width:100%;height:100%;object-fit:cover}.wt .bm-visa{font-size:15px}.wt .bm-mz{font-size:12px}.wt .bm-mc i{width:20px;height:20px}.wt .bm-mc i+i{margin-inline-start:-8px}
.wrow .wm small{font-size:15px;font-weight:700;color:var(--text)}.wrow .wm b{font-size:16px}.wcur{font-size:12px;font-weight:600;color:var(--mut)}
.chev{opacity:.4;font-size:24px;line-height:1}html[dir=ltr] .chev{transform:scaleX(-1)}

/* ===== home redesign: header, hero, recent ===== */
.hdr2{display:flex;align-items:center;gap:12px;margin:4px 2px 14px}
.hdr2 .hg{flex:1;min-width:0;text-align:start}
.hdr2 .hg b{display:block;font-size:18px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr2 .hg small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.hdr2 .av{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--acc);display:grid;place-items:center;padding:0;flex:none;box-shadow:var(--shadow-card)}
.hdr2 .bell{width:46px;height:46px;border:1px solid var(--line);background:var(--glass)}
:root .g.bal.hero2{background:linear-gradient(135deg,#8a6cff 0%,#5f7bff 48%,#2f6dff 100%)!important;border:0!important;border-radius:28px!important;padding:20px 20px 0!important;box-shadow:0 16px 36px rgba(63,90,255,.32)!important;position:relative;overflow:hidden;color:#fff}
.hero2::after{display:none}
.hero2 .hwave{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;pointer-events:none}
.hero2>*{position:relative}.hero2>.hwave{position:absolute}
.h2top{display:flex;justify-content:space-between;align-items:center}
.h2t{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:#fff}
.h2ic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}
.hero2 .h2eye{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;padding:0}
.hero2 .h2n{font-size:50px;font-weight:800;letter-spacing:-.5px;margin:14px 0 8px;color:#fff;line-height:1.1}
.hero2 .h2n small{font-size:18px;font-weight:600;color:rgba(255,255,255,.85)!important;margin-inline-start:6px}
.hero2 .wbrk{margin:2px 0 8px}
.hero2 .sub2{color:rgba(255,255,255,.85)!important}
.h2pill{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border-radius:99px;padding:7px 8px 7px 18px;font-size:14px;color:#fff;margin:6px 0 16px}
.h2ring{width:32px;height:32px;border-radius:50%;flex:none;background:conic-gradient(var(--rc) calc(var(--p)*1%),rgba(255,255,255,.3) 0);-webkit-mask:radial-gradient(farthest-side,transparent 60%,#000 62%);mask:radial-gradient(farthest-side,transparent 60%,#000 62%)}
.h2foot{display:flex;align-items:center;gap:10px;margin:0 -20px;padding:13px 20px;background:rgba(255,255,255,.13);font-size:13.5px;color:rgba(255,255,255,.9)}
.h2foot i{font-style:normal;font-size:20px;line-height:1}
.rc2{padding:16px 14px 14px!important;border-radius:26px!important}
.rc2h{display:flex;align-items:center;gap:8px;margin:0 6px 12px}
.rc2h b{font-size:16px;font-weight:700;color:var(--text)}.rc2ic{color:var(--acc);display:grid;place-items:center}
.rc2l{background:rgba(127,140,180,.08);border-radius:22px;padding:2px 10px}
.rr{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rr:last-child{border-bottom:0}
.rri{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;overflow:hidden}
.rri .thumb{width:54px;height:54px;border-radius:50%}
.rrm{flex:1;min-width:0}.rrm b{display:block;font-size:15.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrm small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.rra{text-align:end;direction:ltr;flex:none}.rra b{display:block;font-size:18px;font-weight:800;white-space:nowrap}.rra small{display:block;font-size:12px;margin-top:1px}
.rra.pos b,.rra.pos small{color:#10b981}.rra.neg b,.rra.neg small{color:#f43f5e}
.rra small{opacity:.85}
.rrc{font-style:normal;color:var(--mut);font-size:22px;flex:none;line-height:1}

/* ===== accent-driven hero + animated waves + palette ===== */

.hero2 .hwave svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.hero2 .hwave .w1 path{fill:rgba(255,255,255,.13)}
.hero2 .hwave .w2 path{fill:rgba(255,255,255,.09)}
.hero2 .hwave .w1{animation:wvA 13s linear infinite}
.hero2 .hwave .w2{animation:wvA 19s linear infinite reverse}
@keyframes wvA{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.swgrid{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 12px}

.ccrow input[type=color]{width:46px;height:38px;padding:2px;border-radius:12px;border:1px solid var(--line);background:var(--inp)}
.cprev{flex:1;height:38px;border-radius:12px}
.tabs.tw{flex-wrap:wrap!important;overflow:visible!important;gap:4px}.tabs.tw .chip{flex:1 1 calc(33% - 6px)!important;white-space:nowrap}

/* ===== Appearance sheet: premium, black & white base ===== */
.panel.themeSheet{background:#0b0c0f!important;color:#f5f6f8!important;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.themeSheet .grab{background:#2a2e37}
.themeSheet h3{color:#fff}
.themeSheet .themeCard{background:#15171c!important;border:1px solid #20232b!important;border-radius:22px!important;box-shadow:none!important;padding:16px 16px 18px!important;margin:0 0 14px!important}
.thTitle{font-size:14px;color:#9aa2b1;margin:0 0 12px;font-weight:600}
.modeRow{display:flex;gap:10px}
.modeTile{flex:1;position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px;border-radius:18px;background:#1c1f26;border:1px solid #2a2e37;color:#c9ced8;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s ease}
.modeTile.on{background:#1b2640;border:2px solid #4f7cff;color:#fff;box-shadow:0 0 0 4px rgba(79,124,255,.15)}
.modeTile .chk{width:20px;height:20px;border-radius:50%;background:#4f7cff;color:#fff;font-size:12px;display:grid;place-items:center;flex:none}
.thRow{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;color:#e6e9ef;font:inherit;font-size:15px;padding:12px 2px 0;cursor:pointer;margin-top:10px;border-top:1px solid #20232b}
.sw2{width:46px;height:28px;border-radius:999px;background:#2a2e37;position:relative;transition:background .25s}
.sw2 i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s}
.sw2.on{background:#4f7cff}
.sw2.on i{transform:translateX(-18px)}
[dir=ltr] .sw2.on i{transform:translateX(18px)}
.swgrid6{display:grid;grid-template-columns:repeat(6,1fr);gap:14px 10px;justify-items:center}
.sw6{width:44px;height:44px;border-radius:50%;border:0;position:relative;cursor:pointer;transition:transform .2s}

:root[data-theme="dark"].black .g,:root[data-theme="dark"].black .sgrp{background:#1c1c1e!important;border-color:#2c2c2e!important}
:root[data-theme="dark"].black .bal{background:linear-gradient(135deg,var(--acc),var(--acc2))!important}
/* the appearance sheet follows the same system colours */

.themeSheet .themeCard{background:var(--glass)!important;border:1px solid var(--line)!important}
.thTitle{color:var(--mut)}
.modeTile{background:var(--inp);border:1px solid var(--line);color:var(--text)}
.modeTile.on{background:rgba(var(--accrgb),.14);border:2px solid var(--acc);color:var(--text);box-shadow:0 0 0 4px rgba(var(--accrgb),.14)}
.modeTile .chk{background:var(--acc)}
.thRow{color:var(--text);border-top:1px solid var(--line)}
.sw2{background:var(--line)}

.mixSlots{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 14px}

.mixTools small{color:var(--mut);font-size:12px;line-height:1.4}

#s-th{padding-top:0}
.thHead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.thBack{width:40px;height:40px;border-radius:50%;border:0;background:var(--glass);color:var(--text);font-size:26px;line-height:1;box-shadow:var(--shadow-card);display:grid;place-items:center;cursor:pointer}

function dailyCheck(ty){
  if(ty!=='expense')return false;const lim=+P().dailyLimit||0;if(!(lim>0))return false;
  const td=iso(new Date()),sp=S.tx.filter(t=>t.type==='expense'&&t.date===td).reduce((a,t)=>a+t.amt,0);
  if(sp>lim){toast(tr('عديت الحد اليومي للمصروف ⚠️')+' ('+f(sp)+' / '+f(lim)+')');return true}
  if(sp>=lim*.8){toast(tr('قربت توصل للحد اليومي')+' ('+f(sp)+' / '+f(lim)+')');return true}
  return false}
function budgetCheck(ty,cat){

function dragTo(cx){

  const q=d.getBoundingClientRect(),r0=T[0].getBoundingClientRect(),w=Math.max(...T.map(b=>b.getBoundingClientRect().width));
  dr.style.opacity=1;dr.style.width=w+'px';dr.style.height=r0.height+'px';dr.style.top=(r0.top-q.top)+'px';
  dr.style.left=Math.max(4,Math.min(q.width-w-4,cx-q.left-w/2))+'px';
  let best=0,bd=1e9;T.forEach((b,i)=>{const r=b.getBoundingClientRect(),dd=Math.abs(r.left+r.width/2-cx);if(dd<bd){bd=dd;best=i}});
  T.forEach(b=>{const r=b.getBoundingClientRect(),k=Math.max(0,1-Math.abs(r.left+r.width/2-cx)/(w*1.25));b.style.setProperty('--z',(1+0.5*Math.pow(k,1.5)).toFixed(3))});
  if(nd&&nd.idx!==best){nd.idx=best;T.forEach((b,i)=>b.classList.toggle('pv',i===best));hv(4)}
}

/* Save a file on any platform. Inside the Android app: write to app cache, then open the system share sheet (Save to Files / Drive / WhatsApp...). No storage permission needed. In a browser: normal download. */
async function saveFile(name,mime,text){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    try{
      const FS=C.Plugins.Filesystem;
      const data=btoa(unescape(encodeURIComponent(text)));
      const w=await FS.writeFile({path:name,data,directory:'CACHE',recursive:true});
      await C.Plugins.Share.share({title:name,files:[w.uri]});
      return;
    }catch(e){toast('تعذّر حفظ الملف');return}
  }
  try{
    const file=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
}

}

async function voiceToggle(){
  if(isRec()){voiceStop();return}
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){toast(tr('التسجيل الصوتي مش مدعوم على الجهاز ده'));return}
  try{vStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
    vRec=new MediaRecorder(vStream,Object.assign({audioBitsPerSecond:32000},mt?{mimeType:mt}:{}));vChunks=[];
    vRec.ondataavailable=e=>{if(e.data&&e.data.size)vChunks.push(e.data)};
    vRec.onstop=()=>{vStream.getTracks().forEach(t=>t.stop());clearInterval(vTimer);const b=new Blob(vChunks,{type:vRec.mimeType||'audio/webm'});const r=new FileReader();r.onload=()=>{pendingVoice=r.result;refreshAdd()};r.readAsDataURL(b)};

function saveTx(){
  if(isRec()){toast(tr('وقّف التسجيل الأول'));return}
  const isSplit=add.type==='income'&&add.split&&S.wallets.length>1;
  const parts=isSplit?[...document.querySelectorAll('.wsp')].map(i=>({w:i.dataset.w,a:parseFloat(i.value)||0})).filter(p=>p.a>0):null;
  const amt=isSplit?(parts||[]).reduce((a,p)=>a+p.a,0):parseFloat($('#a-amt').value);if(!(amt>0)){alert(tr('اكتب المبلغ'));return}
  const ty=add.type,note=$('#a-note')?$('#a-note').value.trim():'';
  if((ty==='loan'||ty==='borrow')&&!note){alert(tr('اكتب اسم الشخص'));return}
  const tx={id:Date.now()+'',type:ty,cat:add.cat,amt,note,date:$('#a-date').value||iso(new Date()),due:$('#a-due')?$('#a-due').value:'',t:Date.now()};
  if(ty==='transfer'){const a=$('#a-w1').value,b=$('#a-w2').value;if(a===b){alert(tr('اختار محفظتين مختلفتين'));return}tx.w=a;tx.w2=b;tx.cat=''}
  else if(isSplit){pendingPhoto=null;parts.forEach((p,i)=>{const o=Object.assign({},tx,{id:tx.id+'_'+i,amt:p.a,w:p.w});if(i===0&&pendingVoice){o.voice=o.id;photoPut('v_'+o.id,pendingVoice).catch(()=>{});pendingVoice=null}S.tx.push(o)});S.lastW=parts[0].w;save();go('home');budgetCheck(ty,add.cat);if(ty==='income')askTithe(amt,parts[0].w);return}
  else{tx.w=add.w||W0().id;S.lastW=tx.w}
  if(pendingPhoto){tx.photo=tx.id;photoPut(tx.id,pendingPhoto).catch(()=>{});pendingPhoto=null}
  if(pendingVoice){tx.voice=tx.id;photoPut('v_'+tx.id,pendingVoice).catch(()=>{});pendingVoice=null}
  S.tx.push(tx);save();go('home');budgetCheck(ty,add.cat);if(ty==='income')askTithe(amt,tx.w);
}

/* ---- generic stacked-card engine (used by wallets and the home overview) ---- */
function stackPos(n,sel,k){const rel=(k-sel+n)%n;return rel===0?'f0':rel===1?'f1':rel===2?'f2':'fh'}
function stackApply(box,skip){const cards=[...box.querySelectorAll('.sk')];const n=cards.length;const sel=box._sel||0;if(box.classList.contains('wstack'))walSelIdx=sel;
  cards.forEach((c,k)=>{c.classList.remove('f0','f1','f2','fh');c.classList.add(stackPos(n,sel,k));if(c===skip)return;c.style.transform='';c.style.opacity='';c.style.transition=''})}
function stackInit(box){if(!box||box._ok)return;box._ok=1;box._sel=box._sel||0;stackApply(box);
  const W=box.classList.contains('wstack')?{f1:[14,-22,.94,.9],f2:[28,-44,.88,.65],fh:[0,60,.8,0]}:{f1:[12,-18,.94,.9],f2:[24,-36,.88,.65],fh:[0,50,.8,0]},F0=[0,0,1,1],L=(a,b,t)=>a+(b-a)*t;
  const put=(el,a,b,t)=>{if(!el)return;el.style.transition='none';el.style.opacity=L(a[3],b[3],t);el.style.transform=`translate(calc(-50% + ${L(a[0],b[0],t)}px),${L(a[1],b[1],t)}px) scale(${L(a[2],b[2],t)})`};
  const behind=t=>{put(box.querySelector('.f1'),W.f1,F0,t);put(box.querySelector('.f2'),W.f2,W.f1,t);put(box.querySelector('.fh'),W.fh,W.f2,t)};
  let d=null;
  box.addEventListener('pointerdown',e=>{const el=e.target.closest('.sk');if(!el||!el.classList.contains('f0')||box._busy)return;d={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,lt:performance.now(),v:0,el,lock:null,dx:0}});
  box.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(!d.lock){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;d.lock=Math.abs(dx)>Math.abs(dy)*1.2?'h':'v';if(d.lock==='h'){try{d.el.setPointerCapture(e.pointerId)}catch(_){}d.el.style.transition='none'}}
    if(d.lock!=='h')return;
    const now=performance.now(),dt=now-d.lt;if(dt>0){d.v=.75*d.v+.25*((e.clientX-d.lx)/dt)}d.lx=e.clientX;d.lt=now;d.dx=dx;
    if(!d.raf)d.raf=requestAnimationFrame(()=>{d.raf=0;if(!d)return;d.el.style.transform=`translate(calc(-50% + ${d.dx}px),0) rotate(${d.dx/24}deg)`;behind(Math.min(1,Math.abs(d.dx)/(box.clientWidth*.45)))})});
  const end=e=>{if(!d||e.pointerId!==d.id)return;const s=d;d=null;if(s.raf)cancelAnimationFrame(s.raf);
    if(s.lock!=='h'){return}
    const dx=s.dx,w=box.clientWidth,n=box.querySelectorAll('.sk').length,fast=Math.abs(s.v)>.4;
    if(n>1&&e.type!=='pointercancel'&&(fast||Math.abs(dx)>w*.25)){
      const dir=(fast?Math.sign(s.v):Math.sign(dx))||1,dur=Math.round(Math.max(200,Math.min(360,330-Math.abs(s.v)*110)));
      s.el.style.transition=`transform ${dur}ms cubic-bezier(.2,.75,.3,1),opacity ${dur}ms ease-out`;
      s.el.style.transform=`translate(calc(-50% + ${dir*w*1.05}px),0) rotate(${dir*12}deg)`;s.el.style.opacity='0';
      box._busy=1;box._sel=((box._sel||0)+1)%n;stackApply(box,s.el);
      setTimeout(()=>{const el=s.el;el.style.transition='none';el.style.transform='';el.style.opacity='0';void el.offsetWidth;el.style.transition='';el.style.opacity='';box._busy=0},dur+30)}
    else{s.el.style.transition='transform .32s cubic-bezier(.2,.9,.3,1)';s.el.style.transform='';stackApply(box,s.el)}};
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  box.addEventListener('click',e=>{if(box._busy)return;const c=e.target.closest('.sk');if(!c||c.classList.contains('f0'))return;box._sel=[...box.querySelectorAll('.sk')].indexOf(c);stackApply(box)});
}

function wTile(w){const kd=wKind(w),s=wSub(w);

  if(kd==='visa'){const br=w.brand||'visa',c=BR[br]||BR.visa;return `<div class="wt" style="background:linear-gradient(135deg,${c[0]},${c[1]})">${brandMark(br)}</div>`}

function wListHTML(){const L=S.wallets.filter(w=>walFilter==='all'||wKind(w)===walFilter);

function wstackInit(){const c=document.querySelector('#s-wal .wcar');if(!c)return;const cards=[...c.children].filter(e=>e.classList.contains('wcard3'));if(!cards.length)return;
  const dots=[...document.querySelectorAll('#s-wal .wdots i')];
  const upd=()=>{const r=c.getBoundingClientRect(),mid=r.left+r.width/2;let best=0,bd=1e9;
    cards.forEach((el,i)=>{const b=el.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-mid),t=Math.min(1,d/(el.offsetWidth*.95));el.style.transform=`scale(${1-.15*t})`;el.style.opacity=1-.35*t;el.style.zIndex=t<.5?2:1;if(d<bd){bd=d;best=i}});
    walSelIdx=best;dots.forEach((x,i)=>x.classList.toggle('on',i===best))};
  c.addEventListener('scroll',()=>{if(c._r)return;c._r=requestAnimationFrame(()=>{c._r=0;upd()})},{passive:true});
  cards.forEach((el,i)=>el.addEventListener('click',()=>{if(i!==walSelIdx)walGo(i)}));
  const r=c.getBoundingClientRect(),b=cards[Math.min(walSelIdx,cards.length-1)].getBoundingClientRect();c.scrollLeft+=(b.left+b.width/2)-(r.left+r.width/2);upd()}
function walScr(){

function saveWalBal(id){

/* generic sheet */
function sheet(h){$('#sheet').innerHTML=`<div class="back" onclick="closeSheet()"></div><div class="panel det"><div class="grab"></div>${h}</div>`;$('#sheet').classList.add('on')}
/* ---- salary ---- */
let salRows=[];
const salDue=()=>{const n=new Date();return Math.min(S.sal.day,new Date(n.getFullYear(),n.getMonth()+1,0).getDate())};
function salCheck(){const Z=S.sal,n=new Date(),td=iso(n);
  if(!Z||!Z.on||!(Z.amt>0)||Z.done===td.slice(0,7)||Z.snooze===td||n.getDate()<salDue())return false;
  salAsk();return true}
function salAsk(){const Z=S.sal;sheet(`<div class="avatar">💰</div><h3>المرتب نزل؟</h3><p style="text-align:center">${f(Z.amt)} ${CUR()}</p><button class="btn" onclick="salYes()">✅ أيوه، نزل</button><button class="btn s" onclick="salLater()">⏳ لسه</button><button class="btn s" onclick="salSkip()">تخطي الشهر ده</button>`)}
function salLater(){S.sal.snooze=iso(new Date());save();closeSheet();toast('تمام، هسألك تاني بكرة')}
function salSkip(){S.sal.done=iso(new Date()).slice(0,7);save();closeSheet();remSync()}
function salYes(){const Z=S.sal,have=new Set(S.wallets.map(w=>WK[w.name]||w.id));
  salRows=S.wallets.map(w=>({key:WK[w.name]||w.id,id:w.id,name:w.name,ico:w.ico||'👛'}));
  [['cash','Cash','💵'],['visa','Visa','💳'],['wallet','Wallet','📱']].forEach(([k,n,i])=>{if(!have.has(k))salRows.push({key:k,id:'',name:n,ico:i,nw:1})});
  const sp=Z.split||{},has=Object.keys(sp).some(k=>salRows.some(r=>r.key===k));
  sheet(`<h3>المرتب ماشي معاك ازاي؟</h3><p style="text-align:center">وزّع المرتب على كاش وفيزا ومحافظك</p><label class="flab">المبلغ اللي نزل</label><div class="fcard amt"><input id="sal-tot" type="number" inputmode="decimal" class="amtin" value="${Z.amt}" oninput="salSum()"><span class="cur">${CUR()}</span></div><div style="margin-top:10px">${salRows.map((r,i)=>`<div class="fcard frow" style="margin-bottom:8px"><span class="ficon2">${r.ico}</span><span class="fv">${U(wLab(r))}</span><input class="wsp" data-i="${i}" type="number" inputmode="decimal" placeholder="0" value="${has?(sp[r.key]?Math.round(Z.amt*sp[r.key]):''):(i===0?Z.amt:'')}" oninput="salSum()"></div>`).join('')}</div><div id="salS" class="sec" style="text-align:center"></div><button class="btn" onclick="salSave()">سجّل المرتب</button>`);salSum()}
const salVals=()=>salRows.map((r,i)=>parseFloat(document.querySelector(`.wsp[data-i="${i}"]`).value)||0);
function salSum(){const t=salVals().reduce((a,b)=>a+b,0),T=parseFloat($('#sal-tot').value)||0,d=T-t,e=$('#salS');if(e)e.textContent=tr('الموزّع')+': '+f(t)+' / '+f(T)+(d>0.5?'  •  '+tr('باقي')+' '+f(d):d<-0.5?'  •  '+tr('فوق المتوقع')+' '+f(-d):' ✓')}
function salSave(){const v=salVals(),tot=v.reduce((a,b)=>a+b,0);if(!(tot>0)){toast('اكتب المبلغ');return}
  const now=Date.now(),td=iso(new Date()),sp={};
  if(!S.wallets.length)salRows.forEach((r,i)=>{r.id='w'+now+i;S.wallets.push({id:r.id,name:r.name,ico:r.ico,open:0});r.nw=0});
  salRows.forEach((r,i)=>{if(!(v[i]>0))return;if(r.nw){r.id='w'+now+i;S.wallets.push({id:r.id,name:r.name,ico:r.ico,open:0})}
    S.tx.push({id:now+'_s'+i,type:'income',cat:'مرتب',amt:v[i],note:'',w:r.id,date:td,due:'',t:now+i});sp[r.key]=v[i]/tot;S.lastW=r.id});
  S.sal.split=sp;S.sal.done=td.slice(0,7);save();closeSheet();go('home');toast('تم تسجيل المرتب ✅')}
function salHTML(){const Z=S.sal;return `<div class="g"><div class="tabs" style="margin:0 0 8px"><button class="chip ${Z.on?'on':''}" onclick="salTog()">${Z.on?'تذكير المرتب شغّال ✓':'تفعيل تذكير المرتب'}</button></div><label>يوم نزول المرتب (1-31)</label><input id="sl-d" type="number" inputmode="numeric" value="${Z.day||''}" placeholder="5"><label>مبلغ المرتب</label><input id="sl-a" type="number" inputmode="decimal" value="${Z.amt||''}" placeholder="5000"><button class="btn" onclick="salCfg()">حفظ</button></div>`}
function salTog(){if(S.sal.on){S.sal.on=false;save();remSync();setScr()}else salCfg()}
function salCfg(){const d=parseInt($('#sl-d')?$('#sl-d').value:S.sal.day),a=parseFloat($('#sl-a')?$('#sl-a').value:S.sal.amt);
  if(!(a>0)||!(d>=1&&d<=31)){toast('اكتب يوم ومبلغ صح');return}
  S.sal.day=d;S.sal.amt=a;S.sal.on=true;S.sal.snooze='';save();remSync();setScr();closeSheet();render();toast('تم حفظ إعدادات المرتب')}
/* ---- start-of-month bills ---- */
function billChips(){return `<div class="tabs wide" style="margin:0 0 10px">${['رصيد الخط','باك أب النت','المياه','الغاز','الكهرباء'].map(n=>`<button class="chip" onclick="billQuick('${n}')">${n}</button>`).join('')}</div>`}
function billQuick(n){const e=$('#b-name');if(e){e.value=tr(n);const a=$('#b-amt');if(a){a.focus();a.scrollIntoView({block:'center'})}}}
const billsLeft=()=>{const L=inP(period(0));return S.bills.filter(b=>!L.some(t=>t.bill===b.id))};
function billsCheck(){if(!S.bills.length)return;const p=period(0);if(S.mbShown===p.si)return;S.mbShown=p.si;save(false);if(billsLeft().length)billsSheet()}
function billsSheet(){const un=billsLeft();if(!un.length){closeSheet();toast('كل فواتير الشهر اتدفعت ✅');return}
  sheet(`<div class="avatar">🧾</div><h3>فواتير الشهر دي</h3><p style="text-align:center">اضغط "دفعت" لما تسدّد الفاتورة</p><div class="g">${un.map(b=>`<div class="row"><div class="ic" style="background:rgba(245,158,11,.22)">🧾</div><div class="m"><b>${U(b.name)}</b><small>${f(b.amt)} ${CUR()} • استحقاق يوم ${b.day}</small></div><button class="chip" onclick="billPay('${b.id}')">دفعت ✓</button></div>`).join('')}</div><button class="btn s" onclick="closeSheet()">لاحقًا</button>`)}
function billPay(id){const b=S.bills.find(x=>x.id===id);if(!b)return;S.tx.push({id:Date.now()+'',type:'expense',cat:'فواتير',amt:b.amt,note:b.name,bill:b.id,date:iso(new Date()),t:Date.now()});save();billsSheet();render()}
function afterUnlock(n=0){clearTimeout(afterUnlock.h);afterUnlock.h=setTimeout(()=>{if(document.querySelector('#ob.on,#tour.on,#lock.on,#sheet.on')){if(n<40)afterUnlock(n+1);return}if(!salCheck())billsCheck()},n?3000:900)}
/* ---- biometric / device-credential lock (replaces the old PIN) ---- */
let lockedNow=false,authBusy=false;
const bioNative=()=>{const P=window.Capacitor&&Capacitor.Plugins;return P?((P.BiometricAuth||P.BiometricAuthNative)?'ba':P.NativeBiometric?'nb':''):''};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function bioSupported(){if(bioNative())return true;try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function bioAuth(setup){authBusy=true;
  try{const P=window.Capacitor&&Capacitor.Plugins,n=bioNative(),why=tr('تأكيد هويتك');
    if(n==='ba'){await (P.BiometricAuth||P.BiometricAuthNative).authenticate({reason:why,allowDeviceCredential:true,cancelTitle:tr('إلغاء'),androidTitle:why});return true}
    if(n==='nb'){await P.NativeBiometric.verifyIdentity({reason:why,title:why,useFallback:true});return true}
    const ch=crypto.getRandomValues(new Uint8Array(32));
    if(setup||!S.cred){const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:APP_NAME},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'my-cash-tracker',displayName:APP_NAME},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});S.cred=b64(c.rawId);save(false);return true}
    await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:'public-key',id:unb64(S.cred)}],userVerification:'required',timeout:60000}});return true
  }catch(e){return false}finally{setTimeout(()=>authBusy=false,700)}}
function lockDraw(msg){$('#lock').innerHTML=`<div style="max-width:360px;margin:16vh auto 0;text-align:center"><div style="font-size:56px">🔒</div><h2>${APP_NAME}</h2><p style="color:var(--mut)">${tr(msg||'التطبيق مقفول')}</p><button class="btn" onclick="lockTry()">🔓 ${tr('افتح')}</button></div>`;$('#lock').classList.add('on')}
async function lockTry(){if(authBusy)return;const ok=await bioAuth();if(ok)closeLock();else lockDraw('التأكيد فشل، حاول تاني')}
function lockShow(){lockedNow=true;lockDraw();lockTry()}
async function lockToggle(){
  if(S.pin){showLock('off');return}
  if(S.lock){if(await bioAuth()){S.lock=false;S.cred='';save();toast('تم إيقاف القفل');setScr()}else toast('التأكيد فشل، حاول تاني');return}
  if(!(await bioSupported())){alert(tr('القفل مش مدعوم على الجهاز ده'));return}
  if(await bioAuth(true)){S.lock=true;save();toast('تم تفعيل القفل');setScr()}else toast('التأكيد فشل، حاول تاني')}

(function(){
  const C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform()||!C.Plugins)return;
  const P=C.Plugins;
  if(P.App){
    P.App.addListener('backButton',()=>{
      if($('#sheet').classList.contains('on')){closeSheet();return}
      if(cur!=='home'){go('home');return}

  if(P.StatusBar){

    const apply=()=>{try{P.StatusBar.setStyle({style:dark()?'DARK':'LIGHT'});P.StatusBar.setBackgroundColor({color:dark()?'#000000':'#f2f5fb'})}catch(e){}};

})();

(function(){
  let sx=0,sy=0,edge=null,t0=0;
  const W=()=>window.innerWidth;
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;t0=Date.now();
    edge=(sx<22)?'L':(sx>W()-22)?'R':null;

    if(!edge)return;
    const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;

  obj(2,()=>push('<< /Type /Pages /Count '+N+' /Kids ['+jpgs.map((_,i)=>(5+3*i)+' 0 R').join(' ')+'] >>'));

<script>

function fixedCard(){

  ${items.slice(0,4).map(x=>`<div class="row"><div class="ic" style="background:rgba(var(--accrgb),.18)">${x.k}</div><div class="m"><b>${U(x.n)}</b>${x.d?`<small>${tr('يوم')} ${x.d}</small>`:''}</div><div class="a exp">${f(x.a)}</div></div>`).join('')}${items.length>4?`<button class="btn s" style="width:100%;margin-top:8px" onclick="setPlanTab('com')">${tr('عرض كل الالتزامات')} (${items.length})</button>`:''}</div>`}
function autoBackupRun(force){

<script>
/* ===== v14: forecast, subscriptions, people (debts), 50/30/20 rule, receipts, profiles ===== */
const _td=()=>iso(new Date());
const daysTo=ds=>Math.round((new Date(ds+'T00:00:00')-new Date(_td()+'T00:00:00'))/864e5);

/* ---------- end-of-month forecast ---------- */
function forecastCard(p,L,s,left,hero){
  const td=_td(),n=new Date(),dim=Math.round((p.e-p.s)/864e5)+1,el=Math.max(1,dim-left+1);
  const head=(sub,body,ic)=>`<div class="g"><div class="row" style="border:0;padding:0"><div class="ic" style="background:rgba(var(--accrgb),.18)">${ic||'🔮'}</div><div class="m"><b>${tr('توقع نهاية الشهر')}</b><small style="white-space:normal">${body}</small>${sub?`<small style="display:block;margin-top:4px;color:var(--mut)">${sub}</small>`:''}</div></div></div>`;
  const varTx=L.filter(t=>t.type==='expense'&&!t.bill&&!t.rec&&!t.sub);
  if(varTx.length<3||el<2)return head('',tr('سجّل كام عملية كمان وهنقدر نتوقع لك'));
  const varSo=varTx.reduce((a,t)=>a+t.amt,0),todaySp=varTx.filter(t=>t.date===td).reduce((a,t)=>a+t.amt,0),avg=varSo/el;
  const bd=S.bills.filter(b=>!L.some(t=>t.bill===b.id)).reduce((a,b)=>a+(+b.amt||0),0);
  const rc=S.rec.filter(r=>r.type==='expense'&&!L.some(t=>t.rec===r.id)&&(r.start||'')<=p.ei.slice(0,7)).reduce((a,r)=>a+(+r.amt||0),0);
  const sb=(S.subs||[]).filter(x=>x.next<=p.ei).reduce((a,x)=>a+(+x.amt||0),0);
  const fixed=bd+rc+sb,futureVar=avg*Math.max(0,left-1)+Math.max(0,avg-todaySp),end=hero-fixed-futureVar,safe=Math.max(0,(hero-fixed)/left);
  const sub=`${tr('متوسط صرفك اليومي')}: ${f(avg)} · ${tr('الحد الآمن يوميًا')}: ${f(safe)} ${CUR()}`;
  if(end>=0)return head(sub,`${tr('على سرعتك الحالية هيفضل معاك حوالي')} <b style="color:#22c55e">${f(end)} ${CUR()}</b> ${tr('في آخر الشهر')}`,'✅');
  const a2=hero-fixed;
  if(a2<=0)return head(sub,`<b style="color:#ef4444">${tr('الفلوس الحالية مش هتكفي الالتزامات الجاية (فواتير واشتراكات)')}</b>`,'⚠️');
  const days=Math.floor(a2/Math.max(avg,1)),ro=new Date(n.getFullYear(),n.getMonth(),n.getDate()+days);
  return head(sub,`<b style="color:#ef4444">${tr('الفلوس هتخلص تقريبًا يوم')} ${ro.getDate()} ${tr(MN[ro.getMonth()])}</b> — ${tr('قبل آخر الشهر بـ')} ${Math.max(0,left-1-days)} ${tr('يوم')}`,'⚠️');
}

/* ---------- subscriptions ---------- */
function addCycle(ds,cy,day){const [y,m]=ds.split('-').map(Number);let ny=y,nm=m;if(cy==='y')ny++;else{nm++;if(nm>12){nm=1;ny++}}const dim=new Date(ny,nm,0).getDate();return ny+'-'+String(nm).padStart(2,'0')+'-'+String(Math.min(day||+ds.slice(8,10),dim)).padStart(2,'0')}
function subsCard(){
  const subs=S.subs||[],mo=x=>x.cycle==='y'?x.amt/12:x.amt,tm=subs.reduce((a,x)=>a+mo(x),0);
  const list=subs.slice().sort((a,b)=>a.next.localeCompare(b.next)).map(x=>{const d=daysTo(x.next);
    const badge=d<0?`<span class="badge r">${tr('متأخر')}</span>`:d<=3?`<span class="badge r">${d===0?tr('النهارده'):d===1?tr('بكرة'):tr('بعد')+' '+d+' '+tr('يوم')}</span>`:'';
    return `<div class="row"><div class="ic" style="background:rgba(var(--accrgb),.18)">${ICON[x.cat]||'📺'}</div><div class="m tap" onclick="openSub('${x.id}')"><b>${U(x.name)}</b><small>${x.next} · ${x.cycle==='y'?tr('سنوي'):tr('شهري')} ${badge}</small></div><div class="a exp">${f(x.amt)}</div><button class="chip" onclick="subPay('${x.id}')">${tr('دفعت')} ✓</button></div>`}).join('');
  return `<div class="g"><div class="sec" style="margin-top:0">📺 ${tr('الاشتراكات')}</div>
  ${subs.length?`<div class="lg"><span>${tr('إجمالي الاشتراكات شهريًا')}</span><b>${f(tm)} ${CUR()}</b></div><div class="lg"><span>${tr('في السنة')}</span><b>${f(tm*12)} ${CUR()}</b></div>${list}`:`<div class="empty">${tr('لسه مفيش اشتراكات')}</div>`}
  <details class="adf"><summary class="btn s">➕ ${tr('اشتراك جديد')}</summary><input id="sb-name" placeholder="${tr('اسم الاشتراك (مثال: نتفليكس)')}">
  <div class="row" style="border:0;padding:8px 0 0"><input id="sb-amt" type="number" inputmode="decimal" placeholder="${tr('المبلغ')}"><select id="sb-cycle"><option value="m">${tr('شهري')}</option><option value="y">${tr('سنوي')}</option></select></div>
  <label>${tr('تاريخ التجديد الجاي')}</label><input id="sb-next" type="date" value="${_td()}"><label>${tr('البند')}</label><select id="sb-cat">${CATS.expense.map(c=>`<option value="${c[1]}" ${c[1]==='ترفيه'?'selected':''}>${c[0]} ${c[1]}</option>`).join('')}</select>
  <button class="btn s" style="width:100%" onclick="subAdd()">${tr('إضافة اشتراك')}</button></details></div>`}
function subAdd(){const n=($('#sb-name').value||'').trim(),a=parseFloat($('#sb-amt').value),nx=$('#sb-next').value;
  if(!n||!(a>0)||!nx){alert(tr('اكتب الاسم والمبلغ وتاريخ التجديد'));return}
  S.subs=S.subs||[];S.subs.push({id:'s'+Date.now(),name:n,amt:a,cycle:$('#sb-cycle').value,next:nx,day:+nx.slice(8,10),cat:$('#sb-cat').value});save();remSync();planScr();toast('اتحفظ ✅')}
function subPay(id){const x=(S.subs||[]).find(s=>s.id===id);if(!x)return;
  S.tx.push({id:Date.now()+'',type:'expense',cat:x.cat,amt:x.amt,note:x.name,w:W0().id,date:_td(),sub:x.id,t:Date.now()});
  let nx=addCycle(x.next,x.cycle,x.day),g=0;while(nx<=_td()&&g++<400)nx=addCycle(nx,x.cycle,x.day);x.next=nx;save();remSync();planScr();toast('تم تسجيل الدفع');budgetCheck('expense',x.cat)}
function openSub(id){const x=(S.subs||[]).find(s=>s.id===id);if(!x)return;
  sheet(`<h3 style="text-align:center">📺 ${tr('تعديل الاشتراك')}</h3><label>${tr('اسم الاشتراك')}</label><input id="es-name" value="${esc(x.name)}"><label>${tr('المبلغ')}</label><input id="es-amt" type="number" inputmode="decimal" value="${x.amt}"><label>${tr('تاريخ التجديد الجاي')}</label><input id="es-next" type="date" value="${x.next}"><label>${tr('الدورة')}</label><select id="es-cycle"><option value="m" ${x.cycle==='m'?'selected':''}>${tr('شهري')}</option><option value="y" ${x.cycle==='y'?'selected':''}>${tr('سنوي')}</option></select>
  <button class="btn" style="width:100%" onclick="subSave('${id}')">${tr('حفظ التعديلات')}</button><button class="btn s" style="width:100%;color:#fca5a5" onclick="subDel('${id}')">🗑 ${tr('مسح الاشتراك')}</button>`)}
function subSave(id){const x=(S.subs||[]).find(s=>s.id===id),a=parseFloat($('#es-amt').value);if(!x||!(a>0))return;
  x.name=($('#es-name').value||'').trim()||x.name;x.amt=a;x.next=$('#es-next').value||x.next;x.day=+x.next.slice(8,10);x.cycle=$('#es-cycle').value;save();remSync();closeSheet();planScr();toast('تم التحديث')}
function subDel(id){if(!cfm(tr('تمسح الاشتراك ده؟')))return;S.subs=(S.subs||[]).filter(s=>s.id!==id);save();remSync();closeSheet();planScr()}
function subsAlert(){
  const due=(S.subs||[]).map(x=>({x,d:daysTo(x.next)})).filter(o=>o.d<=3).sort((a,b)=>a.d-b.d).slice(0,2);if(!due.length)return '';
  return `<div class="g tap" onclick="go('plan')">${due.map(o=>`<div class="row" style="border:0;padding:4px 0"><div class="ic" style="background:rgba(245,158,11,.22)">🔔</div><div class="m"><b>${U(o.x.name)}</b><small>${o.d<0?tr('اتأخر تجديده'):o.d===0?tr('بيتجدد النهارده'):o.d===1?tr('بيتجدد بكرة'):tr('بيتجدد بعد')+' '+o.d+' '+tr('يوم')}</small></div><div class="a exp">${f(o.x.amt)}</div></div>`).join('')}</div>`}
{const _ri=remItems;remItems=function(){const out=_ri();
  if(S.rem.due){const now=new Date(),end=new Date(now.getTime()+35*864e5);
    (S.subs||[]).forEach(x=>{const [y,m,d]=x.next.split('-').map(Number),w=new Date(y,m-1,d,9,0);w.setDate(w.getDate()-1);if(w>now&&w<end)out.push({k:'sub'+x.id+x.next,title:'📺 '+x.name,body:'بيتجدد بكرة: '+f(x.amt)+' '+CUR(),at:w})})}
  return out}}

/* ---------- people: unified debts & loans ---------- */
const pKey=n=>(n||'').trim().toLowerCase();
function peopleData(){const g={};[...openLoans(),...openDebts()].forEach(l=>{const k=pKey(l.note)||'?';const o=g[k]=g[k]||{k,name:(l.note||'').trim()||'—',items:[],mine:0,his:0};o.items.push(l);if(l.type==='loan')o.mine+=l.rem;else o.his+=l.rem});return Object.values(g).sort((a,b)=>Math.abs(b.mine-b.his)-Math.abs(a.mine-a.his))}
function debtsSummary(){const P0=peopleData();if(!P0.length)return '';const m=P0.reduce((a,o)=>a+o.mine,0),h=P0.reduce((a,o)=>a+o.his,0);
  return `<div class="g tap" onclick="openPeople()"><div class="row" style="border:0;padding:0"><div class="ic" style="background:rgba(139,92,246,.22)">🤝</div><div class="m"><b>${tr('الديون والسلف')}</b><small>${P0.length} ${tr('أشخاص')} · ${tr('ليك')} ${f(m)} · ${tr('عليك')} ${f(h)}</small></div><span class="lnk">›</span></div></div>`}
function openPeople(){const P0=peopleData(),td=_td(),m=P0.reduce((a,o)=>a+o.mine,0),h=P0.reduce((a,o)=>a+o.his,0);
  sheet(`<h3 style="text-align:center">🤝 ${tr('الديون والسلف')}</h3>
  <div class="g"><div class="lg"><span>${tr('ليك عند الناس')}</span><b class="inc">${f(m)} ${CUR()}</b></div><div class="lg"><span>${tr('عليك للناس')}</span><b class="exp">${f(h)} ${CUR()}</b></div><div class="lg"><span>${tr('الصافي')}</span><b>${m-h<0?'-':'+'}${f(Math.abs(m-h))} ${CUR()}</b></div></div>
  <div class="g">${P0.length?P0.map((o,i)=>{const net=o.mine-o.his,late=o.items.some(l=>l.due&&l.due<td);
    return `<div class="row tap" onclick="openPerson(${i})"><div class="ic" style="background:rgba(139,92,246,.22)">${esc(o.name.charAt(0).toUpperCase())}</div><div class="m"><b>${U(o.name)}</b><small>${o.items.length} ${tr('عملية')}${late?' · <span class="badge r">'+tr('متأخرة')+'</span>':''}</small></div><div class="a ${net>=0?'loan':'dbt'}">${net===0?tr('متعادلين'):f(Math.abs(net))}<small>${net>0?tr('ليك عنده'):net<0?tr('عليك له'):''}</small></div></div>`}).join(''):`<div class="empty">${tr('مفيش ديون ولا سلف مفتوحة 🎉')}</div>`}</div>`)}
function openPerson(i){const o=peopleData()[i];if(!o){closeSheet();return}
  sheet(`<div class="avatar">${esc(o.name.charAt(0).toUpperCase())}</div><div class="pname">${U(o.name)}</div>
  ${o.items.map(l=>{const D=l.type==='borrow';return `<div class="g"><div class="lg"><span>${D?'💳 '+tr('دين عليك'):'🤝 '+tr('سلفة ليك')}</span><b>${f(l.rem)} ${CUR()}</b></div><small style="color:var(--mut)">${l.date}${l.rem<l.amt?' · '+tr('الأصلي')+' '+f(l.amt):''}</small>
  <div style="margin-top:8px;display:flex;gap:8px;align-items:center"><small style="white-space:nowrap">${tr('الميعاد')}:</small><input type="date" value="${l.due||''}" onchange="setDue('${l.id}',this.value)"></div>
  <div style="display:flex;gap:8px;margin-top:8px"><button class="btn s" style="flex:1;margin:0" onclick="openRepay('${l.id}')">${D?tr('سدّدت'):tr('استرجعت')}</button>${D?'':`<button class="btn s" style="flex:1;margin:0" onclick="waRemind('${l.id}')">📲 ${tr('ذكّره')}</button>`}</div></div>`}).join('')}
  <button class="btn s" style="width:100%" onclick="openPeople()">${tr('رجوع')}</button>`)}
function setDue(id,v){const t=S.tx.find(x=>x.id===id);if(!t)return;t.due=v||'';save();remSync();toast('اتحفظ ✅')}
function waRemind(id){const l=S.tx.find(x=>x.id===id);if(!l)return;const rem=remaining(l);
  const msg='أهلاً '+(l.note||'')+'، بفكّرك بالسلفة اللي المتبقي منها '+f(rem)+' '+CUR()+' (من '+l.date+(l.due?'، وميعادها '+l.due:'')+'). لو تقدر ترجّعها قريب ياريت 🙏';
  const u='https://wa.me/?text='+encodeURIComponent(msg);try{window.open(u,'_blank','noopener')}catch(e){location.href=u}}

/* ---------- 50/30/20 rule ---------- */
function ruleGet(){return Object.assign({on:false,n:50,w:30,s:20,wants:['تسوق','ترفيه','أخرى']},S.rule||{})}
function ruleSet(k,v){const r=Object.assign({},ruleGet());if(k==='on')r.on=!r.on;else if(k==='cat')r.wants=r.wants.includes(v)?r.wants.filter(x=>x!==v):r.wants.concat(v);else r[k]=Math.max(0,Math.min(100,parseFloat(v)||0));S.rule=r;save();planScr()}
function ruleBase(){return Math.max(S.sal&&S.sal.on?(+S.sal.amt||0):0,sums(inP(period(0))).income)}
function ruleCard(){
  const r=ruleGet();
  const head=`<div class="row" style="border:0;padding:0 0 4px"><div class="m"><b>${tr('قاعدة تقسيم الدخل')} ${r.n}/${r.w}/${r.s}</b><small style="display:block;color:var(--mut)">${tr('احتياجات / رغبات / ادخار')}</small></div><button class="sw2 ${r.on?'on':''}" onclick="ruleSet('on')" aria-label="rule"><i></i></button></div>`;
  if(!r.on)return `<div class="g">${head}</div>`;
  const L=inP(period(0)),base=ruleBase(),exp=L.filter(t=>t.type==='expense'),sum=x=>x.reduce((a,t)=>a+t.amt,0);
  const wantsSp=sum(exp.filter(t=>r.wants.includes(t.cat))),needsSp=sum(exp.filter(t=>!r.wants.includes(t.cat))),sv=sum(L.filter(t=>t.type==='save'))-sum(L.filter(t=>t.type==='unsave'));
  const bar=(label,pct,sp,isSave)=>{const tg=base*pct/100,ratio=tg>0?sp/tg:0,col=isSave?(ratio>=1?'#22c55e':'#f59e0b'):(ratio>=1?'#ef4444':ratio>=.8?'#f59e0b':'#22c55e');
    return `<div style="margin:10px 0"><div class="lg"><span>${label}</span><b>${f(sp)} / ${f(tg)} ${CUR()}</b></div><div class="pbar" style="margin:4px 0"><i style="width:${Math.min(100,Math.max(0,ratio*100))}%;background:${col}"></i></div></div>`};
  const tot=r.n+r.w+r.s,pin=(k,l)=>`<div style="flex:1;min-width:0"><label>${l}</label><input type="number" inputmode="decimal" min="0" max="100" value="${r[k]}" onchange="ruleSet('${k}',this.value)"></div>`;
  return `<div class="g">${head}
  ${base>0?`<small style="color:var(--mut)">${tr('الدخل المعتمد')}: ${f(base)} ${CUR()}</small>${bar('🏠 '+tr('احتياجات'),r.n,needsSp,false)}${bar('🎉 '+tr('رغبات'),r.w,wantsSp,false)}${bar('💰 '+tr('ادخار'),r.s,sv,true)}`:`<div class="empty">${tr('سجّل دخلك أو المرتب عشان نحسب النسب')}</div>`}
  <div class="row" style="border:0;padding:4px 0 0;gap:8px;align-items:flex-end">${pin('n',tr('احتياجات')+' %')}${pin('w',tr('رغبات')+' %')}${pin('s',tr('ادخار')+' %')}</div>
  ${tot!==100?`<small style="color:#f59e0b">${tr('مجموع النسب لازم يبقى 100')} (${tot})</small>`:''}
  <label>${tr('اختار الرغبات (الباقي احتياجات)')}</label><div class="tabs wide" style="margin-bottom:0">${CATS.expense.map(c=>`<button class="chip ${r.wants.includes(c[1])?'on':''}" onclick="ruleSet('cat','${c[1]}')">${c[0]} ${c[1]}</button>`).join('')}</div>
  <button class="btn s" style="width:100%" onclick="ruleApply()">🎯 ${tr('طبّق على ميزانيات البنود')}</button></div>`}
function ruleApply(){const r=ruleGet(),base=ruleBase();if(!(base>0)){toast('سجّل دخلك أو المرتب عشان نحسب النسب');return}
  if(!confirm(tr('ده هيستبدل ميزانيات البنود الحالية. تكمل؟')))return;
  const hist=c=>{let t=0;for(let o=-3;o<=-1;o++)t+=inP(period(o)).filter(x=>x.type==='expense'&&x.cat===c).reduce((a,x)=>a+x.amt,0);return t};
  const grp=(cats,total)=>{if(!cats.length)return;const w=cats.map(hist),sw=w.reduce((a,b)=>a+b,0);cats.forEach((c,i)=>{const share=sw>0?(w[i]/sw)*.9+.1/cats.length:1/cats.length,v=Math.round(total*share/10)*10;if(v>0)S.budgets[c]=v;else delete S.budgets[c]})};
  const names=CATS.expense.map(c=>c[1]);grp(names.filter(c=>!r.wants.includes(c)),base*r.n/100);grp(names.filter(c=>r.wants.includes(c)),base*r.w/100);
  save();planScr();toast('تم تطبيق الميزانيات ✅')}

/* ---------- receipts ---------- */
function imgToData(file,cb){const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const max=1280,r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',0.72))};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('الصورة مش مقروءة')};img.src=url}
function receiptEdit(t){
  return t.photo?`<label>${tr('صورة الإيصال (اختياري)')}</label><div class="fcard frow"><img data-ph="${t.photo}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px" onclick="viewPhoto('${t.photo}')"><span class="fv" style="flex:1">${tr('الإيصال مرفوع ✓')}</span><button class="btn s" style="width:auto;padding:6px 10px" onclick="rcDel('${t.id}')">${tr('مسح')}</button></div>`
  :`<label>${tr('صورة الإيصال (اختياري)')}</label><div class="fcard frow"><span class="ficon2">🧾</span><label class="fv" style="cursor:pointer;flex:1">${tr('اضغط تصور أو تختار صورة')}<input type="file" accept="image/*" capture="environment" onchange="rcAttach('${t.id}',this)" style="display:none"></label></div>`}
function rcAttach(id,inp){const f0=inp.files&&inp.files[0],t=S.tx.find(x=>x.id===id);if(!f0||!t)return;imgToData(f0,d=>{photoPut(id,d).then(()=>{t.photo=id;save();openEdit(id);toast('اتحفظ ✅')}).catch(()=>toast('تعذّر حفظ الصورة'))});inp.value=''}
function rcDel(id){const t=S.tx.find(x=>x.id===id);if(!t||!t.photo)return;photoDel(t.photo);delete t.photo;save();openEdit(id)}
function rcDel2(id){const t=S.tx.find(x=>x.id===id);if(!t||!t.photo||!cfm(tr('تمسح الإيصال ده؟')))return;photoDel(t.photo);delete t.photo;save();openReceipts()}
{const _oe=openEdit;openEdit=function(id){_oe(id);setTimeout(loadThumbs,30)}}

/* ---------- profiles (family) ---------- */
function PMget(){try{const m=JSON.parse(localStorage.getItem('masrofaty_profiles')||'null');if(m&&m.list&&m.list.length)return m}catch(e){}return{active:'main',list:[{id:'main',name:'أنا'}]}}
function PMset(m){try{localStorage.setItem('masrofaty_profiles',JSON.stringify(m))}catch(e){}}
function abKey(){const m=PMget();return 'masrofaty_autobak'+(m.active==='main'?'':'_'+m.active)}
function profName(){const m=PMget(),x=m.list.find(z=>z.id===m.active);return x?x.name:''}
function profSwitch(id){const m=PMget();if(id===m.active)return;
  try{save(false);const cur=localStorage.getItem('masrofaty');if(cur!==null)localStorage.setItem('masrofaty_p_'+m.active,cur);
    const nx=localStorage.getItem('masrofaty_p_'+id);if(nx!==null)localStorage.setItem('masrofaty',nx);else localStorage.removeItem('masrofaty');
    localStorage.removeItem('masrofaty_p_'+id);m.active=id;PMset(m);location.reload()}catch(e){toast('تعذّر التبديل')}}
function profAdd(){const n=(($('#pf-name')||{}).value||'').trim();if(!n){toast('اكتب اسم الملف');return}const m=PMget(),id='p'+Date.now();m.list.push({id,name:n});PMset(m);profSwitch(id)}
function profRename(id){const m=PMget(),x=m.list.find(z=>z.id===id);if(!x)return;const nm=prompt(tr('اسم الملف'),x.name);if(nm&&nm.trim()){x.name=nm.trim();PMset(m);openSet('profiles');setScr()}}
function profDel(id){const m=PMget();if(id===m.active)return;if(!confirm(tr('هتمسح الملف ده وكل بياناته. تكمل؟')))return;try{localStorage.removeItem('masrofaty_p_'+id)}catch(e){}m.list=m.list.filter(z=>z.id!==id);PMset(m);openSet('profiles')}
function profFamily(){const m=PMget();
  if(m.list.length<2)return `<div class="g"><small style="color:var(--mut)">${tr('أضف ملف تاني (زوجة، ابن...) عشان تشوف تقرير العيلة المجمّع')}</small></div>`;
  const p=period(0);let TI=0,TE=0;
  const rows=m.list.map(x=>{let D=null;if(x.id===m.active)D=S;else{try{D=JSON.parse(localStorage.getItem('masrofaty_p_'+x.id)||'null')}catch(e){}}
    const s=sums(((D&&D.tx)||[]).filter(t=>t.date>=p.si&&t.date<=p.ei));TI+=s.income;TE+=s.expense;
    return `<div class="row"><div class="m"><b>${U(x.name)}</b></div><div style="text-align:end"><small class="inc">+${f(s.income)}</small><br><small class="exp">-${f(s.expense)}</small></div></div>`}).join('');
  return `<div class="g"><div class="sec" style="margin-top:0">👨‍👩‍👧 ${tr('تقرير العيلة')} · ${p.label}</div>${rows}<div class="lg" style="margin-top:8px"><span>${tr('إجمالي الدخل')}</span><b class="inc">${f(TI)} ${CUR()}</b></div><div class="lg"><span>${tr('إجمالي المصروف')}</span><b class="exp">${f(TE)} ${CUR()}</b></div><div class="lg"><span>${tr('المتبقي')}</span><b>${f(TI-TE)} ${CUR()}</b></div></div>`}
function profHTML(){const m=PMget();
  return `<div class="g"><div class="sec" style="margin-top:0">${tr('الملفات')}</div>${m.list.map(x=>`<div class="row"><div class="ic">${x.id===m.active?'✅':'👤'}</div><div class="m" ${x.id===m.active?'':`onclick="profSwitch('${x.id}')" style="cursor:pointer"`}><b>${U(x.name)}</b><small>${x.id===m.active?tr('الملف الحالي'):tr('اضغط للتبديل')}</small></div><button class="chip" onclick="profRename('${x.id}')">✏️</button>${x.id===m.active?'':`<button class="del" onclick="profDel('${x.id}')">🗑</button>`}</div>`).join('')}
  <input id="pf-name" placeholder="${tr('اسم الملف الجديد (مثال: زوجتي)')}" style="margin-top:10px"><button class="btn" style="width:100%" onclick="profAdd()">➕ ${tr('إضافة ملف جديد')}</button></div>${profFamily()}`}

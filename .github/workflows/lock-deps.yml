name: "Generate pinned package-lock.json (run once)"

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write pinned package.json
        working-directory: masrofaty-android
        run: |
          cat > package.json << 'EOF'
          {
            "name": "masrofaty-android",
            "version": "1.0.0",
            "private": true,
            "description": "My Cash: Tracker Android wrapper (Capacitor)",
            "dependencies": {
              "@aparajita/capacitor-biometric-auth": "10.0.0",
              "@capacitor-community/speech-recognition": "7.0.1",
              "@capacitor/android": "8.6.0",
              "@capacitor/app": "8.1.2",
              "@capacitor/app-launcher": "8.0.1",
              "@capacitor/core": "8.6.0",
              "@capacitor/filesystem": "8.1.5",
              "@capacitor/local-notifications": "8.3.1",
              "@capacitor/share": "8.0.3",
              "@capacitor/status-bar": "8.0.4",
              "capacitor-voice-recorder": "7.0.6"
            },
            "devDependencies": {
              "@capacitor/cli": "8.6.0"
            }
          }
          EOF
          cat package.json

      - name: Generate package-lock.json
        working-directory: masrofaty-android
        run: npm install --legacy-peer-deps

      - name: Commit package.json and package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add masrofaty-android/package.json masrofaty-android/package-lock.json
          git commit -m "Pin dependency versions [skip ci]" || echo "nothing to commit"
          git push
